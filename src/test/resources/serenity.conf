serenity {
    take.screenshots = FOR_EACH_ACTION
    test.root = co.com.udea.certificacion.taller.orangehrm
    console.colors = true
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

webdriver {
    driver = chrome
    autodownload = true
    wait.for.timeout = 15000
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
            args = ["start-maximized", "test-type", "no-sandbox",
                    "ignore-certificate-errors", "disable-popup-blocking",
                    "disable-default-apps", "disable-infobars", "disable-gpu",
                    "remote-allow-origins=*"]
        }
    }
}

pages {
    orangeHrmUrl = "https://opensource-demo.orangehrmlive.com/"
}
demo {
    pause.milliseconds = 2000
}